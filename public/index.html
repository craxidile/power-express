    <script>
      // Restore the real path after the GitHub Pages 404.html redirect.
      (function (l) {
        if (l.search[1] === '/') {
          var d = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              d[0] +
              (d[1] ? '?' + d.slice(1).join('&') : '') +
              l.hash
          );
        }
      })(window.location);
    </script>
